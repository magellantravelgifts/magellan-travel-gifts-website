<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Instagram scheduler alert</title>
  </head>
  <body>
    <form name="instagram-scheduler-failure" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="instagram-scheduler-failure">
      <input type="hidden" name="subject" value="Magellan Instagram scheduler job failed">
      <input type="text" name="event">
      <textarea name="message"></textarea>
      <input type="text" name="item_id">
      <input type="text" name="status">
      <input type="text" name="attempts">
      <input type="text" name="circuit_status">
      <input type="text" name="occurred_at">
    </form>
  </body>
</html>
